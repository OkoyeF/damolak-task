name: Build, Test and Deploy

on:
  push:
    branches: [dev, main]

env:
  AWS_REGION:     eu-west-2
  ECR_REPOSITORY: damolak-task

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Run tests
        run: |
          pip install -r app/requirements-test.txt
          python -m pytest app/test_app.py -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      ecr_image_uri: ${{ steps.build.outputs.ecr_image_uri }}
      image_tag:     ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: |
          TAG=$([[ "${{ github.ref_name }}" == "prod" ]] && echo "prod" || echo "dev")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ steps.tag.outputs.tag }}
        run: |
          ECR_IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t $ECR_IMAGE_URI app/
          docker push $ECR_IMAGE_URI
          echo "ecr_image_uri=$ECR_IMAGE_URI" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh \
            ${{ needs.build-and-push.outputs.image_tag }} \
            ${{ needs.build-and-push.outputs.ecr_image_uri }} \
            ${{ env.AWS_REGION }}
